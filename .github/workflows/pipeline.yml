name: Main Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Validate Secrets
        run: |
          echo "REMOTE_HOST: ${{ secrets.REMOTE_HOST }}"
          echo "REMOTE_USER: ${{ secrets.REMOTE_USER }}"
          echo "SSH_KEY present: $([ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && echo 'yes' || echo 'no')"

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          echo "$SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          rsync -avz --progress --delete \
            -e "ssh -i deploy_key.pem -o StrictHostKeyChecking=no" \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'src/' \
            --exclude 'public/' \
            --exclude 'tsconfig.*' \
            --exclude 'vite.config.ts' \
            --exclude 'eslint.config.js' \
            --exclude 'components.json' \
            --exclude 'logs/' \
            --exclude '*.log' \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:~/SigiLife/
          
      - name: Restart Application
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ~/SigiLife
            npm install
            npx prisma migrate deploy --schema=server/prisma/schema.prisma
            npx prisma generate --schema=server/prisma/schema.prisma
            pm2 restart sigilife || pm2 start ecosystem.config.cjs --env production
          EOF
          rm deploy_key.pem
